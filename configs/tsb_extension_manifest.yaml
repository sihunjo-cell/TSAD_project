# GHL·Dev18 밖 TSB-AD-M 파일의 정확한 지문. configs/input_manifest.yaml은 SHA가 Dev18·GHL 실행 증거에 봉인돼 있어
# 따로 둔다. 파일 선택 규칙: TSB-AD-M 원본 목록 200개(TheDatumOrg/TSB-AD Datasets/File_List/TSB-AD-M.csv) 중
# Dev18 밖 family이면서 파일명 도메인 태그가 Sensor·Facility인 파일 전부. GHL은 주실험이라 뺀다. 맞는 파일은 이
# 다섯 개(Genesis·SWaT×2·GECCO·PSM)이고, 규칙에 걸리지 않은 Dev18 밖 family는 CreditCard(Finance)·Daphnet(HumanActivity)다.
# PSM은 원본 TSB-AD-M.zip에서 꺼냈다. 같은 zip의 나머지 네 파일 SHA가 아래 값과 같다.
# series는 실행·점검 순서이자 기록·점수 파일 이름이라 한 번 돌린 뒤에는 바꾸지 않는다. 파일명의 id는 dataset마다
# 겹쳐서(넷이 id_1) 쓰지 않는다.
# SWaT id_2는 PCA_LEGACY가 메모리를 가장 많이 써서 마지막에 둔다.

roles:
  tsb_final:
    dataset: TSB

datasets:
  TSB:
    files:
