# GHL·HAI 공통 전처리 계약.

common:
  downsample_factor: 1
  training_split: full_prefix_v2
  validation_fraction: 0.0
  validation_position: model_native
  validation_split_order: model_native_after_prefix_handoff
  ratio_base: normal_training
  timestamp_as_feature: false
  label_as_feature: false
  label_aggregation: null  # downsample_factor=1이라 집계하지 않는다.
  scaling_owner: registered_executor
  input_dispatch: registered_executor_full_prefix_v2
  methodology_revision: paper_tuning_v4
  prefix_handoff: all_available_rows_before_model_internal_split
  input_scaling:
    training_free: none
    pca_legacy: model_internal_window_standardscaler_full_evaluation
    paano: model_native_revin_without_external_scaler
    gdn: external_minmax_fit_only
    strict_zero_shot: model_native_full_evaluation_statistics

datasets:
  GHL:
    ratios: [5, 10, 20, 40, 60, 80, 100]
    ratio_application: per_training_session
    feature_count: 19
    scaler_fit_scope: current_series_train
  HAI:
    ratios: [5, 10, 20, 40, 60, 80, 100]
    ratio_application: per_training_session
    main_executions:
      - id: train1_to_test1
        normal_training_sessions: [train1]
        test_session: test1
      - id: train1_train2_to_test2
        normal_training_sessions: [train1, train2]
        test_session: test2
    deferred_training_sessions: [train3, train4]
    feature_count: 86
    validation_split_scope: model_native
    scaler_fit_scope: full_prefixes_of_execution_training_sessions
    cross_session_windows: false
