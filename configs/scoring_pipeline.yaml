# 점수 후처리 파이프라인. 근거는 docs/lead/decisions.md에 정리했다.
# GraGOD post_process_scores 경로 사용 금지 — 후처리는 전부 우리 코드 소유 (AGENTS.md 근거 규율).

error:
  type: absolute  # legacy channel-error wrapper 전용
  adapter_primitive: model_declared
  gragod_post_process_scores: false  # 정규화 전 절대 오차를 받는다.

normalization:
  # PCA_LEGACY와 Tier 2만 현재 q-prefix 안의 validation raw score로 추정한다.
  # training-free Tier 1과 strict zero-shot에는 target calibration을 적용하지 않는다.
  method: median_iqr
  estimation_split: current_prefix_validation
  target_free_method: none
  epsilon: 0.01  # d-ailin 방식의 1e-2를 쓴다.
  author_original_appendix: true  # 학습형 모델의 testnorm 민감도에만 한정한다.

smoothing:
  implementation: ours  # GraGOD smooth_scores는 feature 축에 작용하므로 쓰지 않는다.
  kind: trailing_mean  # d-ailin 방식
  window: 4  # 후행 4-창 (before_num=3)
  boundary: first_three_timesteps_zero
  axis: time
  per_channel: true

aggregation:
  mode: max  # 2차원 채널 점수에만 적용한다. scalar는 그대로 저장한다.

pipeline_order:
  raw: [normalize, aggregate_max]
  smoothed: [normalize, smooth_per_channel, aggregate_max]

evaluation:
  main_metric: vus_pr
  n_thresholds: 250
  main_result:
    smoothing_kind: raw
    norm_kind: trainnorm
  l_max_samples:
    GHL: 332
    HAI: 165
  sensitivity:
    l_max_multipliers: [0.5, 1.0, 2.0]
    half_rounding: floor
    smoothing_kind: smoothed
    result_role: appendix_only
  f1:
    threshold_source: metadata.validation_threshold
    quantile: 0.99
    score_source: raw_trainnorm_aggregated_validation
    minimum_validation_score_count: 1000
    test_optimized_main_result: false
  acf_selection:
    input: train_only
    max_lag: 500
    first_peak: strict_local_peak
    ghl_aggregation: median_across_detected_channels
    hai_aggregation: median_across_sessions_per_channel_then_channels
