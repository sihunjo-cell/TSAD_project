# 점수 후처리 파이프라인. 근거는 docs/lead/decisions.md에 정리했다.
# 등록 모델은 공식 native 후처리를 마친 점수를 반환한다.
methodology_revision: paper_tuning_v4

error:
  type: absolute  # legacy channel-error wrapper 전용
  adapter_primitive: model_declared
  gragod_post_process_scores: false  # 정규화 전 절대 오차를 받는다.

normalization:
  method: model_native
  estimation_split: model_declared
  target_free_method: model_native
  epsilon: 0.01  # d-ailin 방식의 1e-2를 쓴다.
  author_original_appendix: false

smoothing:
  implementation: model_native
  kind: model_native
  window: 0  # 공통 저장기는 추가 smoothing을 하지 않는다.
  boundary: model_native
  axis: time
  per_channel: true

aggregation:
  mode: max  # 2차원 채널 점수에만 적용한다. scalar는 그대로 저장한다.

pipeline_order:
  raw: [model_native, aggregate_max]
  smoothed: [identical_to_raw_native_score]

evaluation:
  main_metric: vus_pr
  n_thresholds: 250
  main_result:
    smoothing_kind: raw
    norm_kind: trainnorm
  l_max_samples:
    GHL: 332
    HAI: 165
  sensitivity:
    l_max_multipliers: [0.5, 1.0, 2.0]
    half_rounding: floor
    smoothing_kind: smoothed
    result_role: appendix_only
  f1:
    threshold_source: metadata.validation_threshold
    quantile: 0.99
    score_source: raw_trainnorm_aggregated_validation
    minimum_validation_score_count: 1000
    test_optimized_main_result: false
  acf_selection:
    input: train_only
    max_lag: 500
    first_peak: strict_local_peak
    ghl_aggregation: median_across_detected_channels
    hai_aggregation: median_across_sessions_per_channel_then_channels
