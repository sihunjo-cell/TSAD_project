    target_use: training_free
    preprocess_recipe: {official_procedure: true, calibration: none, component_normalization: full_evaluation_minmax, aggregation: component_max_then_channel_max, official_scope: univariate, multivariate_extension: channelwise_then_project_max, target_statistics_fit: true, evaluation_mode: offline_noncausal, context_policy: component_rolling_fill_before_global_score_minmax}
    fixed: {variance_window: 96, difference_window: 5, difference_centered: true, difference_correction: 1.25}

  PCA_LEGACY:
    tier: t1
    execution_status: ready
    deterministic: true
    source_commit: 6beac72e11d1155ade40870492c00d0d1cfdcaaf
    source_checkpoint_sha256: none
    source_url: https://github.com/TheDatumOrg/TSB-AD
    source_license: Apache-2.0
    local_relationship: official_source_adaptation
    target_use: training_free
    preprocess_recipe: {official_procedure: true, fit_source: full_evaluation, target_statistics_fit: true, window_normalization: official_multi_row_ddof1_uni_column_ddof0, scaler: window_feature_standardscaler_full_evaluation, calibration: none, zero_pruning: true, aggregation: weighted_component_distance_scalar, evaluation_mode: offline_noncausal, context_policy: centered_window_edge_repeat}
    candidate_basis: 공식 multivariate PCA의 n_components 네 값과 window 100을 쓰며 전체 평가 입력을 fit한다.
    fixed: {window: 100, zero_pruning: true}
    grid:
      n_components: [0.25, 0.5, 0.75, null]

  PaAno:
    tier: t2
    execution_status: ready
    deterministic: false
    source_commit: d4c67116190efa4592dc6a8a157ced0def68b6af
    source_checkpoint_sha256: none
    source_url: https://github.com/jinnnju/PaAno
    source_license: MIT
    local_relationship: official_source_adaptation
    target_use: fit_full_prefix
    preprocess_recipe: {recipe_id: paano_official_minimum_v5, official_procedure: true, scaler: none, normalization: model_native_revin, calibration: none, stitching: overlap_mean, aggregation: scalar_patch_top3_cosine, memory_count: official_minimum, memory_cap: none, checkpoint_selection: best_training_loss, evaluation_mode: offline_noncausal, context_policy: stride_one_patch_overlap_mean}
    candidate_basis: 공식 저장소에는 HPO loop가 없어 연결 논문 B.1의 patch·학습률 9개 후보를 유지한다. memory 10%와 최소 500개 규칙, patch 수에 따른 상한·반올림·KMeans·native RevIN은 최신 공식 코드를 따른다.
    fixed: {iterations: 100, batch_size: 512, weight_decay: 0.0001, memory_fraction: 0.1, memory_seed: 42, neighbors: 3, use_revin: true}
    grid:
      patch_size: [32, 64, 96]
      learning_rate: [0.001, 0.0001, 0.00001]

  GDN:
    tier: t2
    execution_status: ready
    deterministic: false
    source_commit: 9853899da860682669a134e4af315d036aab4eca
    source_checkpoint_sha256: none
    source_url: https://github.com/d-ailin/GDN
    source_license: MIT
    local_relationship: official_source_adaptation
    target_use: fit_full_prefix
    preprocess_recipe: {recipe_id: gdn_official_procedure_v4, official_procedure: true, scaler: fit_minmax, input_adaptation: prefix_fit_minmax_supplies_official_preprocessed_input, calibration: official_full_evaluation, native_normalization: full_evaluation_median_iqr, native_smoothing: trailing4, alignment: next_step, aggregation: model_native_channel_max, batch_policy: candidate_batch_size, graph_policy: official_self_inclusive_fixed_topk, checkpoint_selection: validation_loss_early_stopping, validation_policy: official_contiguous_window_holdout, target_statistics_fit: true, evaluation_mode: offline_noncausal, context_policy: next_step_forecast_with_full_evaluation_error_calibration}
    candidate_basis: 공식 저장소에는 완결 HPO grid가 없어 run.sh 한 조합과 논문 SWaT·WADI 주요 값에 코드를 보완한 두 조합을 유지한다. batch 32는 run.sh 값이며 세 조합 모두 최신 train.py의 patience 15와 Adam betas 0.9·0.999를 쓴다. embedding·topk·epoch·validation은 묶어 보존하고 out_layer_num 1에서 hidden은 사용되지 않는다. 세 조합 전체를 공식 HPO grid로 부르지 않는다.
    fixed: {window: 5, stride: 1, learning_rate: 0.001, weight_decay: 0.0, out_layer_num: 1, graph_heads: 1, graph_dropout: 0.0, output_dropout: 0.2, optimizer: Adam}
    candidates:
      - {embedding: 64, hidden: 128, topk: 5, batch_size: 32, epochs: 30, patience: 15, validation_ratio: 0.2, optimizer_betas: [0.9, 0.999]}
      - {embedding: 64, hidden: 64, topk: 15, batch_size: 32, epochs: 50, patience: 15, validation_ratio: 0.1, optimizer_betas: [0.9, 0.999]}
      - {embedding: 128, hidden: 128, topk: 30, batch_size: 32, epochs: 50, patience: 15, validation_ratio: 0.1, optimizer_betas: [0.9, 0.999]}

  TimeRCD:
    tier: t3
    execution_status: ready
    deterministic: true
    source_commit: 372bb980426b2f67007311c6f3165ab789c79bef
    source_checkpoint_sha256: a497ac910f24f8fb347d690a21b60d74bc04785ebc777880553c158dea4434d0
    checkpoint_revision: 0880420070a524efe14d7e163b34dcca90d2be1b
    checkpoint_file: best_model/pretrain_checkpoint_best_multi.pth
    checkpoint_config_sha256: 5d576f85660cc62268566f6281f5840e505672606b51bbb6c93e397a40ebc11f
    source_url: https://github.com/thu-sail-lab/Time-RCD
    source_license: Apache-2.0
    checkpoint_license: Apache-2.0
    local_relationship: package_backed_adapter
    target_use: strict_zero_shot
    preprocess_recipe: {recipe_id: timercd_official_procedure_v4, official_protocol: true, normalization: full_evaluation_channel_zscore, normalization_scope: full_evaluation, calibration: none, target_statistics_fit: true, padding: short_none_long_tail_last_value, aggregation: model_native_scalar_channel_logit_mean, evaluation_mode: offline_noncausal, context_policy: nonoverlap_context_session_tail_padding}
    candidate_basis: 공식 multi 문맥 5000과 전체 평가 입력의 채널별 z-score를 쓴다.
    fixed: {context_length: 5000, checkpoint_variant: multi, score_head: probability}

  TSPulse:
    tier: t3
    execution_status: ready
    deterministic: true
    source_commit: fe7a35697723e2a2f5246ae979474bfc554e26c0
    source_checkpoint_sha256: 57fa03b67d1473a7253ac37801b24c391d1fa931395db986743e2f59e556b9ac
    checkpoint_revision: 2e64fcdc2a06d3565dfadaf0065c0ab5055f80f2
    checkpoint_file: model.safetensors
    checkpoint_config_sha256: e33230f47c91dfe4e848ee743924a62a26f710fe7f194566d92835f27c1c6d8b
    source_url: https://github.com/ibm-granite/granite-tsfm
    source_license: Apache-2.0
    checkpoint_license: Apache-2.0
    local_relationship: package_backed_adapter
    target_use: strict_zero_shot
    preprocess_recipe: {recipe_id: tspulse_official_procedure_v4, official_protocol: true, normalization: full_evaluation_standardscaler_then_model_revin, calibration: official_full_evaluation, target_statistics_fit: true, inference_batch_size: 128, native_smoothing_window: 8, native_smoothing_scope: time_fft_before_ensemble, aggregation: model_native_scalar_heads, evaluation_mode: offline_noncausal, context_policy: official_head_boundary_repeat_then_postprocessing, head_alignment: model_native, ensemble: max_after_head_minmax_and_native_smoothing_then_output_minmax}
    candidate_basis: 논문 부록 A.11.3의 aggregation 64·96·128과 공식 time·fft·pred·ensemble 점수를 모두 보존한다. 승인한 파일별 time·fft 동일 가중 평균으로 공통 창을 고른 뒤 공식 데이터셋별 파일 평균으로 head를 선택한다. 공통 창의 평균식은 프로젝트 보완이다.
    fixed: {context_length: 512, patch_size: 8, heads: [time, fft, pred, ensemble]}
    grid:
      aggregation_window: [64, 96, 128]
