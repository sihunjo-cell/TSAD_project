version: 2

seeds:
  development: [0, 1, 2]
  final: [3, 4, 5, 6, 7]

selection:
  tier_q_floor: {t1: 5, t2: 5, t3: 5}
  minimum_primary_ratio_count: 3
  allowed_primary_hpo_regimes: [full_prefix_per_ratio]
  primary_hpo_regime: full_prefix_per_ratio
  budget_id: null
  selection_status: pending_full_prefix_budget
  selection_rule_id: full_prefix_tspulse_two_stage_family_lofo_v3
  primary_score_variants:
    TSPulse: [time, fft, pred, ensemble]
  diagnostic_score_variants: {}

common_recipe:
  methodology_revision: paper_tuning_v4
  input_dispatch: registered_executor_full_prefix_v2
  training_split: full_prefix_v2
  storage_schema_version: full_prefix_storage.v1
  training_input_contract: current_prefix_input_with_model_native_fit_validation_and_evaluation_statistics
  input_scaling:
    training_free: none
    pca_legacy: model_internal_window_standardscaler_full_evaluation
    paano: model_native_revin_without_external_scaler
    gdn: external_minmax_fit_only
    strict_zero_shot: model_native_full_evaluation_statistics
  score_calibration:
    fit_validation: model_native
    full_prefix_scalar: model_native
    full_prefix_channels: model_native
    target_free: model_native
    epsilon: 0.01
  smoothing:
    kind: model_native
    window: 0
    boundary: model_native
  order:
    raw: model_native_then_aggregate
    smoothed: identical_to_raw_native_score
  aggregation:
    channel_scores: max
    scalar_scores: model_native

models:
  MWVAR:
    tier: t1
    execution_status: ready
    deterministic: true
    source_commit: dcbbd9fbeaabfb27ad084ffa4351a2418ea1dab9
    source_checkpoint_sha256: none
    source_url: https://gitlab.kuleuven.be/m-group-campus-brugge/dtai_public/publications/iclr2026_timeseriesfoundationmodelsad
    source_license: MIT
    local_relationship: behavioral_reimplementation
    target_use: training_free
    preprocess_recipe: {calibration: none, aggregation: max, official_scope: univariate, multivariate_extension: channelwise_then_project_max, evaluation_mode: offline_noncausal, context_policy: centered_window_edge_repeat}
    fixed: {centered: true, ddof: 1}
    candidate_basis: 봉인 저장소의 비교 실행 창 11종이다. 닫힌 공식 HPO grid는 없다.
    grid:
      window: [5, 10, 32, 50, 60, 64, 96, 100, 256, 512, 1024]

  SQDIFF_LAST1:
    tier: t1
    execution_status: ready
    deterministic: true
    source_commit: dcbbd9fbeaabfb27ad084ffa4351a2418ea1dab9
    source_checkpoint_sha256: none
    source_url: https://gitlab.kuleuven.be/m-group-campus-brugge/dtai_public/publications/iclr2026_timeseriesfoundationmodelsad
    source_license: MIT
    local_relationship: behavioral_reimplementation
    target_use: training_free
    preprocess_recipe: {calibration: none, aggregation: max, official_scope: univariate, multivariate_extension: channelwise_then_project_max, evaluation_mode: offline_noncausal, context_policy: trailing_mean_backfill}
    fixed: {lag: 1, window: 2, correction: 2.0}

  SQDIFF_LAST3:
    tier: t1
    execution_status: ready
    deterministic: true
    source_commit: dcbbd9fbeaabfb27ad084ffa4351a2418ea1dab9
    source_checkpoint_sha256: none
    source_url: https://gitlab.kuleuven.be/m-group-campus-brugge/dtai_public/publications/iclr2026_timeseriesfoundationmodelsad
