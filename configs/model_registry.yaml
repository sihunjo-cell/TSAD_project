version: 1

seeds:
  development: [0, 1, 2]
  final: [3, 4, 5, 6, 7]

selection:
  tier_q_floor: {t1: 5, t2: 10, t3: 5}
  minimum_primary_ratio_count: 3
  allowed_primary_hpo_regimes: [equal_trial, runtime_matched]
  primary_hpo_regime: equal_trial
  budget_id: b5367ad431093
  selection_status: ready
  selection_rule_id: tier_fixed_family_lofo_v2
  primary_score_variants:
    TSPulse: [raw_max]
  diagnostic_score_variants:
    TSPulse: [time, fft, pred]

common_recipe:
  input_dispatch: registered_executor_v1
  input_scaling:
    training_free: none
    pca_legacy: model_internal_window_standardscaler_fit_only
    tier2: external_minmax_fit_only
    strict_zero_shot: none
  score_calibration:
    fit_validation: validation_median_iqr
    target_free: none
    epsilon: 0.01
  smoothing:
    kind: trailing_mean
    window: 4
    boundary: first_three_timesteps_zero
  order:
    raw: normalize_then_aggregate
    smoothed: normalize_then_smooth_per_channel_then_aggregate
  aggregation:
    channel_scores: max
    scalar_scores: model_native

models:
