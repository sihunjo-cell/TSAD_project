# 고정 실행 환경. 근거는 docs/lead/decisions.md와
# docs/lead/process_0_preverify.md에 정리했다.
# conda env 이름: tsad_fixed. torch build suffix는 장치에 맞추되 공개 버전은 같다.

python: "3.10.20"
packages:
  numpy: "1.26.4"
  torch: "2.2.2"
  torch-geometric: "2.5.3"
  pytorch-lightning: "2.6.2"
  tensorboardX: "2.6.2.2"
  pandas: "2.3.3"
  scikit-learn: "1.7.2"
  PyYAML: "6.0.3"
  networkx: "3.4.2"
  colorama: "0.4.6"

sources:
  pytorch-lightning: "git+https://github.com/gonzachiar/pytorch-lightning.git@834dbf3039ee82a2ac5e65eed25f9989222283c6"

accelerator:
  local_verification: cpu
  experiment: cpu_or_cuda

# torch-geometric 선정과 pytorch-lightning 설치 근거는
# docs/lead/process_0_preverify.md에 요약했다.
# 별도 scratch 환경에서 확인한 torch 2.10은 이 환경 계약에 포함하지 않는다.
